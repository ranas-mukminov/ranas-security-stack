# Traefik Configuration for ranas-security-stack

# Add this to your Traefik dynamic configuration file (e.g., /etc/traefik/dynamic.yml)
# on run-as-daemon server

http:
  routers:
    stack-router:
      rule: Host(`stack.run-as-daemon.ru`)
      entryPoints:
        - websecure
      service: stack-k3s-service
      tls:
        certResolver: letsencrypt

  services:
    stack-k3s-service:
      loadBalancer:
        servers:
          - url: "http://10.252.1.2:30938"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s
